# Mantém o projeto gratuito do Supabase ativo.
# O plano gratuito pausa o projeto depois de 7 dias sem uso. Esta tarefa faz
# uma leitura leve e real no banco (1 imóvel da tabela pública "imoveis")
# a cada 3 dias. Usa a mesma chave pública do site (js/config.js), então não
# precisa cadastrar nenhum secret no GitHub.
#
# Para testar: GitHub > Actions > "Supabase keep-alive" > Run workflow.

name: Supabase keep-alive

on:
  schedule:
    # 09:17 UTC (06:17 em Brasília), a cada 3 dias.
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/config.js
          sparse-checkout-cone-mode: false

      - name: Consultar o banco
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' js/config.js | head -1)
          KEY=$(grep -oE 'supabaseAnonKey: *"[^"]+"' js/config.js | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Não achei supabaseUrl/supabaseAnonKey em js/config.js"; exit 1
          fi
          for tentativa in 1 2 3; do
            CODE=$(curl -sS -o resposta.json -w '%{http_code}' \
              "$URL/rest/v1/imoveis?select=id&limit=1" \
              -H "apikey: $KEY" || echo 000)
            echo "Tentativa $tentativa: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Banco respondeu: $(cat resposta.json)"; exit 0
            fi
            cat resposta.json 2>/dev/null || true
            sleep 20
          done
          echo "O Supabase não respondeu. Se o projeto já foi pausado, reative em supabase.com/dashboard."
          exit 1
